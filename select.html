<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11 · Select Shop</title><style>body{font:16px system-ui;background:#f3f5f9;color:#17263c;display:grid;place-items:center;min-height:90vh}main{background:white;padding:30px;border-radius:16px;width:min(90vw,430px);box-shadow:0 6px 25px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #bbb}button{background:#153a6b;color:white;cursor:pointer}.warn{color:#a33;font-size:13px}</style><main><h2>Massage POS V11</h2><p>เข้าสู่ร้านทดลอง / Shop pilot login</p><input id="shop" placeholder="Shop ID (e.g. pilot-shop)" autocomplete="off"><input id="pin" type="password" placeholder="Shop test PIN"><button id="go">Open POS</button><p id="msg" class="warn"></p><p class="warn">TEST ONLY · Not secure staff authentication · No real customer data or payments</p></main><script>document.getElementById('go').onclick=async()=>{const id=document.getElementById('shop').value.trim().toLowerCase(),pin=document.getElementById('pin').value;try{const r=await fetch('/api/pos-state',{headers:{'x-shop-id':id,'x-pos-pin':pin}});if(!r.ok)throw Error('Invalid shop ID or PIN');sessionStorage.setItem('pos_shop_id',id);sessionStorage.setItem('pos_shop_pin',pin);location.replace('/')}catch(e){document.getElementById('msg').textContent=e.message}}</script></html>
