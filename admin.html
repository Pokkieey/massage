<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11 · Admin</title><style>body{font:16px system-ui;background:#f3f5f9;color:#17263c;padding:25px}main{max-width:800px;margin:auto;background:white;padding:25px;border-radius:15px}input,button{padding:12px;border:1px solid #aaa;border-radius:7px}button{background:#153a6b;color:white}li{margin:14px 0}.note{color:#a33}</style><main><h2>POS V11 · Platform Admin (Pilot)</h2><p>Enter the admin PIN to view configured shops.</p><input id="pin" type="password" placeholder="POS_ADMIN_PIN"><button id="go">Load shops</button><p id="msg"></p><ul id="shops"></ul><p class="note">Pilot only. To add or edit shops, update POS_SHOPS_JSON in Vercel and redeploy. No real customer data.</p></main><script>document.getElementById('go').onclick=async()=>{const r=await fetch('/api/shops',{headers:{'x-admin-pin':document.getElementById('pin').value}});const x=await r.json();document.getElementById('msg').textContent=r.ok?x.shops.length+' shops':x.error;document.getElementById('shops').replaceChildren(...(x.shops||[]).map(s=>{const li=document.createElement('li');li.textContent=s.name+' — '+s.id;return li}))}</script></html>
